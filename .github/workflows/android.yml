# Builds the Combat Gym Android app on every push to main (and on demand).
# Output: a test APK you can install on a phone, and, once signing secrets exist, the AAB to upload to Google Play.
#
# Settings live in GitHub → Settings → Secrets and variables → Actions:
#   Variables (not secret, they ship inside the app):
#     ADMOB_APP_ID, NEXT_PUBLIC_ADMOB_BANNER_ID, NEXT_PUBLIC_ADMOB_INTERSTITIAL_ID, NEXT_PUBLIC_REVENUECAT_ANDROID_KEY
#     (left empty, Google's test ads are used and Pro shows "coming soon")
#   Secrets (for the Google Play upload file only):
#     ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD
name: Android app

on:
  push:
    branches: [main]
  workflow_dispatch:

# Lets the build publish the test app as a direct download (a GitHub release), so phones get a plain .apk, not a zip.
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ADMOB_APP_ID: ${{ vars.ADMOB_APP_ID }}
      NEXT_PUBLIC_ADMOB_BANNER_ID: ${{ vars.NEXT_PUBLIC_ADMOB_BANNER_ID }}
      NEXT_PUBLIC_ADMOB_INTERSTITIAL_ID: ${{ vars.NEXT_PUBLIC_ADMOB_INTERSTITIAL_ID }}
      NEXT_PUBLIC_REVENUECAT_ANDROID_KEY: ${{ vars.NEXT_PUBLIC_REVENUECAT_ANDROID_KEY }}
      VERSION_CODE: ${{ github.run_number }}
      VERSION_NAME: 1.0.${{ github.run_number }}
      # Secrets cannot be read in step conditions, so expose only whether signing is set up.
      HAS_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      # GitHub's Ubuntu runners already include the Android SDK (ANDROID_HOME); Gradle fetches any missing platform.
      - name: Install
        run: npm ci

      - name: Check
        run: |
          npm run typecheck
          npm run lint
          npm test

      - name: Build the app screens
        run: npm run build

      - name: Copy them into the Android project
        run: npx cap sync android

      - name: Build test APK
        working-directory: android
        run: |
          set -o pipefail
          ./gradlew assembleDebug --stacktrace 2>&1 | tee "$RUNNER_TEMP/gradle.log" || {
            # Surface the cause as an annotation, which is readable without downloading the full log.
            reason=$(sed -n '/What went wrong/,/Try:/p' "$RUNNER_TEMP/gradle.log" | head -40)
            [ -z "$reason" ] && reason=$(grep -iE "error|exception" "$RUNNER_TEMP/gradle.log" | head -40)
            reason="${reason//'%'/'%25'}"; reason="${reason//$'\n'/'%0A'}"; reason="${reason//$'\r'/'%0D'}"
            echo "::error title=Android build failed::$reason"
            exit 1
          }

      - name: Upload test APK
        uses: actions/upload-artifact@v4
        with:
          name: combat-gym-test-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Publish test app as a direct download
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk combat-gym-test.apk
          gh release delete test-app --yes --cleanup-tag 2>/dev/null || true
          gh release create test-app combat-gym-test.apk --prerelease --target "$GITHUB_SHA" \
            --title "Combat Gym test app (build ${{ github.run_number }})" \
            --notes "Latest test build for Android phones. Tap combat-gym-test.apk to download, then open it to install. Uses test ads."

      - name: Build Google Play bundle
        if: ${{ env.HAS_KEYSTORE == 'true' }}
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        working-directory: android
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/release.keystore"
          ANDROID_KEYSTORE_PATH="$RUNNER_TEMP/release.keystore" ./gradlew bundleRelease

      - name: Upload Google Play bundle
        if: ${{ env.HAS_KEYSTORE == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: combat-gym-play-bundle
          path: android/app/build/outputs/bundle/release/app-release.aab
